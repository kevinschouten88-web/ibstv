name: IBStv
options:
  bundleIdPrefix: nl.ibstv
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    ENABLE_BITCODE: NO
targets:
  IBStv:
    type: application
    platform: iOS
    sources:
      - path: IBStv
      - path: www
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.ibstv.app
        PRODUCT_NAME: IBStv
        INFOPLIST_FILE: IBStv/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.2.0"
        CURRENT_PROJECT_VERSION: "4"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
schemes:
  IBStv:
    build:
      targets:
        IBStv: all
    run:
      config: Release
