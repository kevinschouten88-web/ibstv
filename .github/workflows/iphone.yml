name: IBStv iPhone-app bouwen

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Hulpmiddelen installeren
        run: brew install xcodegen

      - name: Speler in de app zetten
        run: |
          rm -rf ios/www && mkdir -p ios/www
          cp -R app/index.html app/vendor app/fonts app/icon.png ios/www/

      - name: Xcode-project maken
        working-directory: ios
        run: |
          xcodegen generate
          pod install --repo-update

      - name: App bouwen (zonder ondertekening)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -workspace IBStv.xcworkspace -scheme IBStv -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -n 80

      - name: IPA maken
        working-directory: ios
        run: |
          APP=$(find build/Build/Products -maxdepth 2 -name 'IBStv.app' -type d | head -1)
          test -n "$APP"
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          zip -qry IBStv-iPhone.ipa Payload
          ls -l IBStv-iPhone.ipa

      - name: Inhoud controleren
        working-directory: ios
        run: |
          du -sh Payload/IBStv.app
          ls Payload/IBStv.app | head -40
          ls Payload/IBStv.app/www

      - uses: actions/upload-artifact@v4
        with:
          name: IBStv-iPhone
          path: ios/IBStv-iPhone.ipa

      - name: Op de downloadpagina zetten
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete iphone-latest -y --cleanup-tag || true
          gh release create iphone-latest ios/IBStv-iPhone.ipa --title "IBStv voor iPhone" \
            --notes "Nieuwste versie van IBStv voor iPhone. Installeer IBStv-iPhone.ipa met Sideloadly (zie LEESMIJ-iPhone.txt)."
