name: IBStv Android-app bouwen

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Android 16 (API 36) installeren
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" >/dev/null

      - name: Beschikbare FFmpeg-versies (ter info)
        run: curl -s https://repo1.maven.org/maven2/org/jellyfin/media3/media3-ffmpeg-decoder/maven-metadata.xml | grep -o '<version>[^<]*' | tail -n 8 || true

      - name: Speler in de app zetten
        run: |
          rm -rf android/app/src/main/assets/www && mkdir -p android/app/src/main/assets/www
          cp -R app/index.html app/vendor app/fonts app/icon.png android/app/src/main/assets/www/

      - name: Uploadsleutel klaarzetten
        env:
          KEY_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEY_B64" ]; then
            echo "$KEY_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "UPLOAD_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "Geen uploadsleutel: ondertekend met de testsleutel (niet voor Google Play)."
          fi

      - name: Bouwen (AAB voor Google Play en APK om zelf te installeren)
        working-directory: android
        env:
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: upload
          VERSION_NAME: '1.4.0'
        run: |
          export VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))   # moet bij elke versie hoger worden
          gradle --no-daemon bundleRelease assembleRelease

      - name: Bestanden verzamelen
        run: |
          mkdir -p out
          cp android/app/build/outputs/bundle/release/*.aab out/IBStv-GooglePlay.aab
          cp android/app/build/outputs/apk/release/*.apk out/IBStv-Android.apk
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: IBStv-Android
          path: out/

      - name: Op de downloadpagina zetten
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest -y --cleanup-tag || true
          gh release create android-latest out/IBStv-GooglePlay.aab out/IBStv-Android.apk --title "IBStv voor Android" \
            --notes "IBStv-GooglePlay.aab is voor de Play Console. IBStv-Android.apk kun je zelf installeren op een telefoon of Google TV."
