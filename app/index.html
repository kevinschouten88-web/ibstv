<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IBStv</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%230A1020%27/%3E%3Crect x=%2712%27 y=%2720%27 width=%2740%27 height=%2730%27 rx=%275%27 fill=%27none%27 stroke=%27%23F3B23F%27 stroke-width=%275%27/%3E%3Cpath d=%27M24 10l8 9 8-9%27 fill=%27none%27 stroke=%27%23F3B23F%27 stroke-width=%275%27 stroke-linecap=%27round%27/%3E%3Ccircle cx=%2746%27 cy=%2744%27 r=%275%27 fill=%27%23E5484D%27/%3E%3C/svg%3E">
<script src="vendor/hls.min.js"></script>
<script src="vendor/mpegts.js"></script>
<style>
@font-face{font-family:"Figtree";font-weight:400;font-display:swap;src:url(fonts/figtree-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Figtree";font-weight:500;font-display:swap;src:url(fonts/figtree-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Figtree";font-weight:600;font-display:swap;src:url(fonts/figtree-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Figtree";font-weight:700;font-display:swap;src:url(fonts/figtree-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Bricolage";font-weight:700;font-display:swap;src:url(fonts/bricolage-grotesque-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Bricolage";font-weight:800;font-display:swap;src:url(fonts/bricolage-grotesque-latin-800-normal.woff2) format("woff2")}
:root{
  --night:#080B18; --iris:#9686FF; --iris-2:#6E5BFF; --live:#FF4F64; --mint:#7EF0C0; --gold:#FFD66E;
  --text:#F2F4FA; --soft:rgba(242,244,250,.74); --muted:rgba(242,244,250,.52); --dim:rgba(242,244,250,.36);
  --glass:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.045));
  --glass-deep:linear-gradient(180deg,rgba(42,46,74,.62),rgba(14,16,32,.72));
  --edge:inset 0 1px 0 rgba(255,255,255,.26),inset 0 0 0 1px rgba(255,255,255,.08);
  --drop:0 24px 60px -24px rgba(0,0,0,.75);
  --blur:blur(28px) saturate(180%);
  --display:"Bricolage","Figtree","Segoe UI",system-ui,sans-serif;
  --font:"Figtree","Segoe UI",system-ui,sans-serif;
  --pad:56px; --dockh:118px;
  /* namen uit de vorige versie, nog gebruikt in code */
  --accent:var(--iris); --accent-2:var(--iris-2); --amber:var(--iris);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--night);color:var(--text);font:15px/1.45 var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:inherit}
h1,h2,h3,h4,p{margin:0}
.hidden{display:none!important}
.t{font-variant-numeric:tabular-nums}
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border:4px solid transparent;background-clip:padding-box;border-radius:12px}
::-webkit-scrollbar-thumb:hover{background-color:rgba(255,255,255,.3)}
::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- Achtergrond ---------- */
#bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:var(--night);pointer-events:none}
#bg .blob{position:absolute;border-radius:50%;filter:blur(100px);opacity:.42}
#bg .b1{width:60vw;height:60vw;left:-16vw;top:-22vw;background:#3A4BFF}
#bg .b2{width:46vw;height:46vw;right:-10vw;top:12vh;background:#9A3CFF}
#bg .b3{width:44vw;height:44vw;left:24vw;bottom:-30vw;background:#0FA3A0}
#ambImg{position:absolute;inset:-14%;background:center/cover no-repeat;filter:blur(70px) saturate(1.45) brightness(.7);opacity:0;transition:opacity 1s ease}
#ambient{display:none}
body.amb-poster #ambImg{opacity:1}
body.no-amb #ambImg{opacity:0!important}
#shade{position:fixed;inset:0;z-index:2;pointer-events:none;
  background:linear-gradient(90deg,rgba(8,11,24,.86) 0%,rgba(8,11,24,.5) 40%,rgba(8,11,24,.08) 72%),
             linear-gradient(0deg,rgba(8,11,24,.96) 0%,rgba(8,11,24,.72) 46%,rgba(8,11,24,.05) 72%)}
body.v-settings #shade{background:rgba(8,11,24,.6)}

/* ---------- Glas ---------- */
.glass,.tile,.vcard,#login .lbox,#tracks,#msg,#osd,#resumeBox,.setgroup,#dlg .box{
  background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:var(--edge),var(--drop)}

/* ---------- Knoppen ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:12px 20px;border-radius:15px;font-weight:600;font-size:15px;
  background:#fff;color:#0E1022;box-shadow:0 14px 34px -16px rgba(255,255,255,.6);transition:transform .15s,background .2s,filter .15s;white-space:nowrap}
.btn svg{width:18px;height:18px;flex:none}
.btn:hover{filter:brightness(.94)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.55;cursor:wait}
.btn.ghost{background:rgba(255,255,255,.12);color:var(--text);box-shadow:var(--edge);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.btn.ghost:hover{background:rgba(255,255,255,.2);filter:none}
.btn.danger{background:rgba(255,79,100,.16);color:#FFC3CB;box-shadow:inset 0 0 0 1px rgba(255,79,100,.4)}
.btn.small{padding:8px 14px;border-radius:12px;font-size:14px}
a.btn{text-decoration:none;color:#0E1022}a.btn.ghost{color:var(--text)}

/* ---------- Merk ---------- */
.mark{display:inline-flex;align-items:center;gap:10px;font:800 21px/1 var(--display);letter-spacing:-.02em}
.mark i{width:22px;height:22px;border-radius:7px;background:conic-gradient(from 210deg,var(--iris),#5CD0FF,var(--live),var(--iris));box-shadow:0 0 18px rgba(150,134,255,.6);flex:none}
.mark em{font-style:normal;color:var(--iris)}

/* ---------- Inloggen ---------- */
#splash{display:none}
html.boot #login{display:none!important}
html.boot #splash{position:fixed;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px}
#splash .mark{font-size:34px;gap:12px}
#splash .mark i{width:34px;height:34px;border-radius:10px}
#splash .spin{width:28px;height:28px;border-radius:50%;border:3px solid rgba(255,255,255,.18);border-top-color:#fff;animation:spin .8s linear infinite}
#login{position:fixed;inset:0;z-index:5;display:flex;padding:24px;overflow-y:auto;-webkit-overflow-scrolling:touch}
#login .lbox{margin:auto}
body.phone #login{padding:calc(var(--sat) + 16px) 16px calc(var(--sab) + 16px)}
body.phone .lbox{padding:28px 22px 22px}
.lbox{width:min(440px,100%);padding:36px 36px 30px;border-radius:30px}
.lbox .mark{font-size:30px;gap:12px}
.lbox .mark i{width:30px;height:30px;border-radius:9px}
.lbox h1{font:800 34px/1.05 var(--display);letter-spacing:-.03em;margin:26px 0 8px}
.lbox p{color:var(--soft);margin:0 0 24px}
.field{display:block;margin-bottom:14px}
.field span{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.field input,.search input,.pinin,.setsel{width:100%;padding:12px 14px;border-radius:14px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.07);color:var(--text);box-shadow:inset 0 1px 2px rgba(0,0,0,.25);transition:border-color .2s,background .2s}
.field input:focus,.search input:focus,.pinin:focus,.setsel:focus{outline:none;border-color:rgba(255,255,255,.55);background:rgba(255,255,255,.1)}
.lbox .lbtns{display:flex;gap:10px;margin-top:10px}
.lbox .lbtns .btn{flex:1;padding:14px}
.err{color:#FF9AA6;font-size:14px;min-height:20px;margin-top:12px}

/* ---------- Opbouw ---------- */
#app{position:fixed;inset:0;z-index:3}
#topline{position:fixed;left:var(--pad);right:var(--pad);top:30px;z-index:6;display:flex;align-items:center;gap:16px;pointer-events:none}
#topline .mark{pointer-events:auto}
#clock{margin-left:auto;font:700 22px/1 var(--display);letter-spacing:-.01em}
body.no-clock #clock{display:none}
main{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;padding:92px var(--pad) calc(var(--dockh) + 10px);transition:padding-bottom .45s cubic-bezier(.2,.8,.2,1)}
body:not(.dock-open) main{padding-bottom:40px}
#top{flex:none;min-height:0}
#bottom{flex:1;min-height:0;display:flex;flex-direction:column;gap:16px;margin-top:22px}
body.full main,body.full #topline{visibility:hidden}

/* ---------- Groot beeld achter alles ---------- */
#stage{position:fixed;inset:0;z-index:1;background:#000;opacity:0;transition:opacity .6s ease;overflow:hidden}
#stage video{width:100%;height:100%;object-fit:cover;display:block;background:#000}
body.bgvideo #stage{opacity:1}
body.full #stage{opacity:1;z-index:50;cursor:default}
body.full #stage video{object-fit:contain}
#stage .idle{display:none}
#stage.loading::after{content:"";position:absolute;left:50%;top:50%;width:42px;height:42px;margin:-21px 0 0 -21px;border-radius:50%;border:3px solid rgba(255,255,255,.2);border-top-color:#fff;animation:spin .8s linear infinite;z-index:2}
body:not(.full) #stage.loading::after{left:auto;right:64px;top:auto;bottom:calc(var(--dockh) + 28px);margin:0}
@keyframes spin{to{transform:rotate(360deg)}}
body.full #stage.idlecursor{cursor:none}

/* ---------- Hero ---------- */
#info{max-width:min(860px,64vw);min-height:0}
.onair{display:flex;align-items:center;gap:12px;color:var(--soft);font-size:16px;flex-wrap:wrap}
.onair img{height:38px;max-width:90px;object-fit:contain;border-radius:8px}
.onair b{color:var(--text);font-weight:700}
.livepill{display:inline-flex;align-items:center;gap:7px;padding:4px 11px 4px 9px;border-radius:999px;background:rgba(255,79,100,.18);color:#FFC3CB;font-weight:600;font-size:13px;box-shadow:inset 0 0 0 1px rgba(255,79,100,.35)}
.livepill i{width:8px;height:8px;border-radius:50%;background:var(--live);box-shadow:0 0 10px var(--live)}
.ht{font:800 clamp(38px,5.2vw,68px)/.98 var(--display);letter-spacing:-.035em;margin:14px 0 14px;text-wrap:balance;text-shadow:0 4px 40px rgba(0,0,0,.35);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.when{display:flex;align-items:center;gap:14px;color:var(--soft);font-size:15px;flex-wrap:wrap}
.when .nx{color:var(--muted)}
.bar{display:inline-block;width:220px;height:6px;border-radius:6px;background:rgba(255,255,255,.18);overflow:hidden;vertical-align:middle}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--iris-2),var(--iris));box-shadow:0 0 14px var(--iris)}
.desc{color:var(--soft);font-size:16px;margin-top:12px;max-width:66ch;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.acts{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.meta{display:flex;gap:16px;color:var(--soft);font-size:15px;flex-wrap:wrap}
.meta .rt{color:var(--gold)}
.meta .ok{color:var(--mint)}
.vhero{display:flex;gap:34px;align-items:flex-end}
.vhero .pst{width:clamp(120px,12vw,190px);aspect-ratio:2/3;border-radius:20px;background:rgba(255,255,255,.08) center/cover;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.14),0 40px 80px -30px rgba(0,0,0,.9)}
.vhero .ht{font-size:clamp(34px,4.4vw,60px);margin:8px 0 10px}
.vhero .txt{min-width:0}
.idlehero .ht{margin-top:0}
.idlehero p{color:var(--soft);max-width:60ch}
@media (max-height:760px){.vhero .pst{display:none}.desc{-webkit-line-clamp:1}}

/* ---------- Groepen (chips) ---------- */
#catbar{flex:none;position:relative;min-width:0;display:flex}
#cats{flex:1;min-width:0;display:flex;gap:10px;align-items:center;overflow-x:auto;overflow-y:hidden;padding:2px 2px 6px;scrollbar-width:none;scroll-behavior:smooth}
#catbar.more-r #cats{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 90px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 90px),transparent)}
#catbar.more-l #cats{-webkit-mask-image:linear-gradient(90deg,transparent,#000 90px);mask-image:linear-gradient(90deg,transparent,#000 90px)}
#catbar.more-l.more-r #cats{-webkit-mask-image:linear-gradient(90deg,transparent,#000 90px,#000 calc(100% - 90px),transparent);mask-image:linear-gradient(90deg,transparent,#000 90px,#000 calc(100% - 90px),transparent)}
.cnav{position:absolute;top:50%;margin-top:-22px;width:40px;height:40px;border-radius:50%;z-index:2;display:none;place-items:center;color:#fff;
  background:var(--glass-deep);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:var(--edge),0 8px 22px -8px rgba(0,0,0,.7);transition:background .2s,transform .15s}
.cnav:hover{background:rgba(255,255,255,.24)}
.cnav:active{transform:scale(.94)}
.cnav svg{width:20px;height:20px}
.cnav.l{left:-6px}.cnav.r{right:-6px}
#catbar.more-l .cnav.l,#catbar.more-r .cnav.r{display:grid}
body.v-settings #catbar{display:contents}
body.v-settings .cnav{display:none!important}
#cats::-webkit-scrollbar{display:none}
.cat{flex:none;display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:999px;font-weight:600;font-size:14px;color:var(--soft);
  background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);transition:background .2s,color .2s;white-space:nowrap}
.cat:hover{background:rgba(255,255,255,.14);color:#fff}
.cat .n{opacity:.6;font-weight:500;font-size:12px}
.cat.on{background:var(--text);color:#0E1022;box-shadow:0 10px 26px -12px rgba(255,255,255,.6)}
.cat.lock .nm::before{content:"🔒";font-size:11px;margin-right:6px}
.search{flex:none;width:min(420px,40vw)}
.search input{padding:10px 16px;border-radius:999px}
#qcats{display:contents}

/* ---------- Lijst ---------- */
#list{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;position:relative;padding:4px 6px 18px 2px;margin:-4px -6px 0 -2px}
.empty{padding:28px 6px;color:var(--soft);font-size:16px;max-width:60ch}
.sentinel{height:1px;grid-column:1/-1}

/* Zendertegels */
#list.rows{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;align-content:start}
.tile{position:relative;border-radius:22px;padding:14px 16px 13px;cursor:pointer;min-width:0;transition:transform .2s cubic-bezier(.2,.8,.2,1),background .2s}
.tile:hover{background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,.07))}
.tile .r1{display:flex;align-items:center;gap:11px;min-width:0}
.tile .logo{width:58px;height:36px;display:grid;place-items:center;flex:none}
.tile .logo img{max-width:58px;max-height:36px;object-fit:contain;border-radius:6px}
.tile .nmw{min-width:0;flex:1}
.tile .cname{display:block;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .num{display:block;color:var(--muted);font-size:12.5px}
body.no-num .tile .num{display:none}
.tile .now{display:block;font-weight:600;font-size:15px;margin-top:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:22px}
.tile .pbar{display:block;height:4px;margin-top:8px;border-radius:4px;background:rgba(255,255,255,.16);overflow:hidden}
.tile .pbar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--iris-2),var(--iris))}
.tile .pbar.off{visibility:hidden}
.tile .next{display:block;color:var(--muted);font-size:13px;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:19px}
.tile .eq{display:none;gap:3px;align-items:flex-end;height:16px;flex:none}
.tile .eq i{width:4px;border-radius:2px;background:var(--iris);box-shadow:0 0 8px var(--iris);animation:eq 1.1s ease-in-out infinite}
.tile .eq i:nth-child(2){animation-delay:-.4s}.tile .eq i:nth-child(3){animation-delay:-.7s}
@keyframes eq{0%,100%{height:35%}50%{height:100%}}
.tile.playing .eq{display:flex}
.tile.playing{box-shadow:var(--edge),0 0 0 2px var(--iris),0 0 34px -4px rgba(150,134,255,.65)}
.tile.sel{background:linear-gradient(180deg,rgba(255,255,255,.24),rgba(255,255,255,.1));transform:translateY(-3px)}
.star{width:32px;height:32px;display:grid;place-items:center;border-radius:50%;color:var(--muted);flex:none;opacity:0;transition:opacity .2s}
.star svg{width:17px;height:17px}
.star:hover{background:rgba(255,255,255,.12);color:#fff}
.tile:hover .star,.fav .star{opacity:1}
.fav .star{color:var(--gold)}
.fav .star svg{fill:currentColor}

/* Posters */
#list.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(146px,1fr));gap:22px 16px;align-content:start}
#list.grid .empty{grid-column:1/-1}
.card{cursor:pointer;min-width:0;position:relative}
.poster{aspect-ratio:2/3;border-radius:16px;overflow:hidden;background:rgba(255,255,255,.08);position:relative;display:grid;place-items:center;
  box-shadow:0 0 0 1px rgba(255,255,255,.1),0 16px 30px -16px rgba(0,0,0,.8);transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s}
.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.poster .ph{font:800 34px var(--display);color:var(--dim)}
.card:hover .poster{transform:translateY(-3px);box-shadow:0 0 0 1px rgba(255,255,255,.22),0 22px 40px -16px rgba(0,0,0,.85)}
.card.sel .poster{transform:scale(1.04);box-shadow:0 0 0 3px #fff,0 0 30px rgba(255,255,255,.28),0 24px 44px -16px rgba(0,0,0,.9)}
.card .ctitle{font-size:13px;margin-top:9px;color:var(--soft);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card.sel .ctitle{color:#fff;font-weight:600}
.card .ctitle small{display:block;color:var(--muted);font-size:12px;margin-top:1px;font-weight:400}
.card .cleft{display:block;color:var(--iris);font-size:12px;margin-top:2px;font-weight:600}
.card .favdot{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;background:rgba(10,14,30,.55);color:var(--gold);display:none;place-items:center;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.card .favdot svg{width:14px;height:14px;fill:currentColor}
.card.fav .favdot{display:grid}
.poster .cprog{position:absolute;left:10px;right:10px;bottom:10px;height:5px;border-radius:5px;background:rgba(0,0,0,.55);overflow:hidden;z-index:2}
.poster .cprog i{display:block;height:100%;background:var(--iris)}
.poster .seen{position:absolute;left:8px;top:8px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;z-index:2;color:var(--mint);background:rgba(10,14,30,.6);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.poster .seen svg{width:14px;height:14px}

/* Sorteren */
.sortbar{grid-column:1/-1;position:sticky;top:0;z-index:3;justify-self:end;display:inline-flex;align-items:center;gap:10px;margin-bottom:2px}
.sortbar .slabel{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:12.5px;font-weight:500;white-space:nowrap;pointer-events:none;user-select:none}
.sortbar .slabel svg{width:15px;height:15px;opacity:.8}
.sortbar .sseg{display:inline-flex;gap:2px;padding:4px;border-radius:14px;
  background:var(--glass-deep);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:var(--edge),0 10px 30px -14px rgba(0,0,0,.7)}
.sortbtn,.seg button{padding:7px 14px;border-radius:10px;font-size:13px;font-weight:600;color:var(--soft);transition:background .2s,color .2s;white-space:nowrap}
.sortbtn:hover,.seg button:hover{color:#fff;background:rgba(255,255,255,.08)}
.sortbtn.on,.seg button.on{background:rgba(255,255,255,.92);color:#0E1022}

/* Afleveringen */
#list.eps{display:flex;flex-direction:column;gap:10px}
.ephead{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 12px;border-radius:20px;
  background:var(--glass-deep);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:var(--edge)}
.ephead .top{display:flex;align-items:center;gap:14px}
.ephead h2{font:700 22px/1 var(--display);letter-spacing:-.02em}
.back{display:inline-flex;align-items:center;gap:6px;padding:8px 14px 8px 10px;border-radius:999px;background:rgba(255,255,255,.12);box-shadow:var(--edge);font-size:14px;font-weight:600}
.back:hover{background:rgba(255,255,255,.2)}
.back svg{width:16px;height:16px}
.seasons{display:inline-flex;gap:2px;padding:4px;border-radius:14px;background:rgba(255,255,255,.07);margin-left:auto;flex-wrap:wrap}
.season{padding:7px 14px;border-radius:10px;font-size:13px;font-weight:600;color:var(--soft)}
.season.on{background:rgba(255,255,255,.92);color:#0E1022}
.row.ep{display:grid;grid-template-columns:150px 1fr auto;gap:18px;align-items:center;padding:10px;border-radius:20px;cursor:pointer;
  background:var(--glass);box-shadow:var(--edge);transition:background .2s}
.row.ep:hover{background:linear-gradient(180deg,rgba(255,255,255,.17),rgba(255,255,255,.07))}
.row.ep.sel{background:linear-gradient(180deg,rgba(255,255,255,.24),rgba(255,255,255,.1))}
.row.ep .th{aspect-ratio:16/9;border-radius:13px;background:rgba(255,255,255,.08) center/cover;position:relative;overflow:hidden}
.row.ep .th .cprog{position:absolute;left:8px;right:8px;bottom:8px;height:4px;border-radius:4px;background:rgba(0,0,0,.55);overflow:hidden}
.row.ep .th .cprog i{display:block;height:100%;background:var(--iris)}
.row.ep .cname{font-weight:600;font-size:16px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.ep .cname .n{color:var(--muted);font-weight:500;margin-right:8px}
.row.ep .cname svg{width:16px;height:16px;color:var(--mint);vertical-align:-2px;margin-right:6px}
.row.ep p{color:var(--muted);font-size:14px;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row.ep .dur{color:var(--muted);font-size:14px;padding-right:10px;white-space:nowrap}
.row.ep .dur.left{color:var(--iris);font-weight:600}
.row.ep.seen .cname{color:var(--soft)}
.iprog{display:flex;align-items:center;gap:14px;color:var(--soft);margin-top:12px;flex-wrap:wrap}

/* ---------- Menubalk onderin ---------- */
#rail{position:fixed;left:50%;bottom:24px;z-index:20;display:flex;align-items:center;gap:4px;padding:8px;border-radius:30px;transform:translate(-50%,0);
  background:var(--glass-deep);-webkit-backdrop-filter:blur(36px) saturate(190%);backdrop-filter:blur(36px) saturate(190%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3),inset 0 0 0 1px rgba(255,255,255,.1),0 30px 70px -20px rgba(0,0,0,.85);
  transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .35s ease}
body:not(.dock-open) #rail{transform:translate(-50%,160%);opacity:0;pointer-events:none}
body.full #rail{z-index:60}
#rail button{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;width:86px;padding:11px 0 9px;border-radius:22px;color:var(--muted);font-size:12px;font-weight:600;transition:background .2s,color .2s}
#rail button svg{width:24px;height:24px}
#rail button:hover{color:#fff;background:rgba(255,255,255,.07)}
#rail button.on{color:#fff;background:rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.28)}
#rail button.on svg{color:var(--iris);filter:drop-shadow(0 0 8px var(--iris))}
#rail .sep{width:1px;height:42px;background:rgba(255,255,255,.12);margin:0 6px}
#rail .badge{position:absolute;top:5px;left:50%;margin-left:6px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--iris);color:#0E1022;font-size:11px;font-weight:700;display:grid;place-items:center}
#grip{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:19;display:flex;flex-direction:column;align-items:center;gap:7px;color:var(--muted);font-size:12px;
  opacity:0;transition:opacity .4s;pointer-events:none}
#grip i{width:84px;height:5px;border-radius:5px;background:rgba(255,255,255,.55);box-shadow:0 0 16px rgba(255,255,255,.35)}
body:not(.dock-open) #grip{opacity:1}
body.full:not(.dock-open) #grip{opacity:0}
body.full.ui-awake:not(.dock-open) #grip{opacity:.8;z-index:55}
#login:not(.hidden) ~ #grip{display:none}
body.tv.full #grip{display:none}

/* ---------- Volledig scherm ---------- */
#osd{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);width:min(1180px,calc(100% - 80px));border-radius:30px;padding:22px 26px;z-index:3;
  background:var(--glass-deep);display:none;opacity:0;transition:opacity .6s ease,bottom .45s cubic-bezier(.2,.8,.2,1);pointer-events:none}
body.full #osd.live{display:block}
#osd.show{opacity:1;transition:opacity .2s ease,bottom .45s cubic-bezier(.2,.8,.2,1)}
body.full.dock-open #osd{bottom:146px}
#osd .o1{display:flex;align-items:center;gap:20px}
#osd .ologo{width:96px;height:62px;display:grid;place-items:center;flex:none}
#osd .ologo img{max-width:96px;max-height:62px;object-fit:contain;border-radius:8px}
#osd .otitle{font:800 34px/1.05 var(--display);letter-spacing:-.025em;margin-top:3px}
#osd .side{margin-left:auto;text-align:right;flex:none}
#osd .oclock{font:700 32px/1 var(--display)}
#osd .side p{color:var(--muted);font-size:14px;margin-top:6px}
#osd .when{margin-top:12px}
#osd .when .bar{flex:1;width:auto;max-width:560px}
.zap{display:flex;gap:10px;margin-top:18px;padding-top:16px;border-top:1px solid rgba(255,255,255,.1)}
.zap .z{flex:1;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;background:rgba(255,255,255,.06);min-width:0}
.zap .z img{height:28px;max-width:52px;object-fit:contain}
.zap .z div{min-width:0}
.zap .z b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zap .z span{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zap .z.cur{background:rgba(150,134,255,.22);box-shadow:inset 0 0 0 1px rgba(150,134,255,.55)}
#osd .ologo.poster{width:70px;height:104px;overflow:hidden;border-radius:12px}
#osd .ologo.poster img{width:100%;height:100%;max-width:none;max-height:none;object-fit:cover}
#osd.vc{pointer-events:auto}
/* Ingebouwde speler van de tv: het beeld ligt onder de pagina */
body.natv,body.natv #stage{background:transparent!important}
body.natv #stage video{visibility:hidden}
body.natv #bg{display:none}
body.natv:not(.full):not(.bgvideo) #bg{display:block}
body.natv.bgvideo #stage,body.natv.full #stage{opacity:1}
body.natv.full #shade{display:none}
#natSub{position:absolute;left:50%;bottom:9%;transform:translateX(-50%);max-width:80%;text-align:center;z-index:2;white-space:pre-line;
  font:600 3.6vh/1.3 var(--font);color:#fff;padding:4px 14px;border-radius:10px;background:rgba(0,0,0,.6);pointer-events:none}
body.full #osd.show ~ #natSub,body.full:has(#osd.show) #natSub{bottom:34%}
#osd .vrow{display:flex;align-items:center;gap:16px;margin-top:16px}
#osd .pp{width:52px;height:52px;border-radius:50%;flex:none;display:grid;place-items:center;background:#fff;color:#0E1022;box-shadow:0 10px 26px -12px rgba(255,255,255,.6)}
#osd .pp svg{width:22px;height:22px}
#osd .skip{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;background:rgba(255,255,255,.12);box-shadow:var(--edge);font:700 12px var(--font)}
#osd .skip:hover{background:rgba(255,255,255,.2)}
#osd .tm{font-size:15px;color:var(--soft);min-width:64px;text-align:center}
#osd .seek{flex:1;height:26px;display:flex;align-items:center;cursor:pointer;position:relative;touch-action:none}
#osd.dragging .seek .knob{transform:scale(1.35)}
#osd.dragging .seek .hover{display:block}
#osd.dragging .seek .bar i{transition:none}
#osd .seek .knob{transition:transform .15s}
#osd .seek .bar{width:100%;height:7px}
#osd .seek .bar i{transition:width .2s}
#osd .seek .knob{position:absolute;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:#fff;box-shadow:0 0 12px var(--iris);pointer-events:none}
#osd .seek .hover{position:absolute;bottom:26px;transform:translateX(-50%);padding:3px 9px;border-radius:8px;background:rgba(10,12,26,.85);font-size:13px;display:none;pointer-events:none}
#osd .seek:hover .hover{display:block}
#osd .vmeta{color:var(--muted);font-size:14px;margin-top:6px}

#topbar{position:absolute;left:0;right:0;top:0;padding:28px 36px;display:none;align-items:center;gap:16px;opacity:0;transition:opacity .6s ease;z-index:4;
  background:linear-gradient(rgba(8,11,24,.55),transparent)}
body.full #topbar{display:flex}
#topbar.show{opacity:1;transition:opacity .2s ease}
#topbar .back,.tbbtn{padding:11px 18px 11px 14px;border-radius:999px;font-size:15px;font-weight:600;background:rgba(30,34,56,.5);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:var(--edge),0 10px 30px -12px rgba(0,0,0,.6)}
#topbar .back:hover,.tbbtn:hover,.tbbtn.on{background:rgba(255,255,255,.2)}
#tbTitle{font:700 19px var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.tbbtn{margin-left:auto;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.tbbtn svg{width:19px;height:19px}

#tracks{position:absolute;right:36px;top:92px;width:min(580px,calc(100% - 72px));max-height:calc(100% - 200px);overflow:auto;display:none;grid-template-columns:1fr 1fr;gap:24px;padding:22px;border-radius:26px;z-index:5;cursor:default;background:var(--glass-deep)}
body.full #tracks:not(.hidden){display:grid}
#tracks h3{margin:0 0 10px;font:600 13px var(--font);color:var(--muted)}
.topt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;border-radius:12px;color:var(--soft)}
.topt:hover{background:rgba(255,255,255,.08)}
.topt .dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--dim);flex:none}
.topt.on{color:#fff;font-weight:600;background:rgba(255,255,255,.1)}
.topt.on .dot{border-color:var(--iris);background:radial-gradient(var(--iris) 0 4px,transparent 5px)}
.topt.load{color:var(--iris);margin-top:6px}
.tnote{color:var(--muted);font-size:13px;margin:8px 12px 0}
.tsize{display:flex;align-items:center;gap:6px;margin:14px 12px 0;color:var(--muted);font-size:13px}
.tsize span{margin-right:4px}
.tsize button{padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.1);font-size:13px;color:var(--soft)}
.tsize button.on{background:rgba(255,255,255,.92);color:#0E1022;font-weight:600}

#msg{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);padding:15px 20px;border-radius:20px;max-width:min(560px,80%);text-align:center;font-size:15px;z-index:90;pointer-events:none;background:var(--glass-deep)}

#resumeBox{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,calc(100% - 48px));padding:28px 30px 26px;border-radius:30px;z-index:7;background:var(--glass-deep);cursor:default}
body:not(.full) #resumeBox{display:none}
#stage.resuming::before{content:"";position:absolute;inset:-8%;z-index:1;background:var(--rbg) center/cover no-repeat,#05070F;filter:blur(46px) saturate(1.5) brightness(.55);transform:scale(1.05)}
#resumeBox .rk{color:var(--muted);font-size:14px}
#resumeBox h3{font:800 30px/1.05 var(--display);letter-spacing:-.025em;margin:6px 0 16px}
#resumeBox .rrow{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:14px}
#resumeBox .bar{flex:1;width:auto}
#resumeBox .rbtns{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
#resumeBox .btn:focus{outline:none;box-shadow:0 0 0 3px #fff,0 0 26px rgba(255,255,255,.3)}

/* ---------- Instellingen ---------- */
body.v-settings #top{display:none}
body.v-settings #bottom{flex-direction:row;gap:28px;margin-top:4px}
body.v-settings #cats{flex-direction:column;align-items:stretch;width:320px;flex:none;overflow-y:auto;overflow-x:hidden;gap:0;padding:0}
.setttl{font:800 42px/1 var(--display);letter-spacing:-.03em;margin:4px 0 20px 6px}
.setnav{border-radius:26px;padding:10px;display:flex;flex-direction:column;gap:2px}
.ci{display:flex;align-items:center;gap:13px;padding:11px 14px;border-radius:16px;color:var(--soft);font-weight:600;font-size:15px;text-align:left;width:100%}
.ci svg{width:20px;height:20px;flex:none;opacity:.85}
.ci small{margin-left:auto;font-weight:500;color:var(--muted);font-size:12px}
.ci:hover{background:rgba(255,255,255,.07);color:#fff}
.ci.on{background:rgba(255,255,255,.15);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.ci.on svg{color:var(--iris);opacity:1}
body.v-settings #list{display:flex;flex-direction:column;gap:16px;padding-bottom:30px}
.ph{display:flex;align-items:baseline;gap:14px;margin:8px 0 2px 4px;flex-wrap:wrap}
.ph h2{font:700 30px/1 var(--display);letter-spacing:-.02em}
.ph span{color:var(--muted)}
.setgroup{border-radius:24px;padding:6px 0;flex:none}
.setgroup h3{font:600 13px var(--font);color:var(--muted);padding:12px 22px 6px}
.sr{display:flex;align-items:center;gap:18px;padding:13px 22px;border-top:1px solid rgba(255,255,255,.06)}
.setgroup h3+.sr,.setgroup .sr:first-child{border-top:0}
.sr .lb{flex:1;min-width:0}
.sr .lb b{display:block;font-weight:600;font-size:15px}
.sr .lb span{display:block;color:var(--muted);font-size:13px;margin-top:1px}
.sr .vl{color:var(--soft);font-size:14px;text-align:right}
.sr .acts{margin-top:0}
.seg{display:inline-flex;gap:2px;padding:4px;border-radius:14px;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);flex:none}
.tg{width:48px;height:28px;border-radius:14px;background:rgba(255,255,255,.18);position:relative;flex:none;transition:background .2s}
.tg::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.4);transition:left .2s}
.tg.on{background:linear-gradient(90deg,var(--iris-2),var(--iris));box-shadow:0 0 16px -2px var(--iris)}
.tg.on::after{left:23px}
.setsel{width:auto;min-width:180px;padding:9px 12px;border-radius:12px;background-color:rgba(30,34,56,.9)}
.setsel option{background:#14172B}
.sw{display:flex;gap:10px}
.sw button{width:28px;height:28px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.sw button.on{box-shadow:0 0 0 2px #0E1022,0 0 0 4px #fff}
.tag{font-size:11px;padding:2px 8px;border-radius:999px;background:rgba(126,240,192,.16);color:var(--mint);margin-left:8px;vertical-align:2px;font-weight:600}
.keys{display:grid;grid-template-columns:150px 1fr;gap:10px 16px;color:var(--soft);padding:10px 22px 16px}
.keys kbd{font:600 13px var(--font);background:rgba(255,255,255,.1);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 2px 0 rgba(0,0,0,.35);border-radius:8px;padding:3px 9px;justify-self:start}
.plrow .act{color:var(--mint);font-size:13px;font-weight:600}
.pinin{width:120px;text-align:center;letter-spacing:.5em;font-size:18px}
.note{color:var(--muted);font-size:13px;padding:2px 22px 14px}
.subcard{display:flex;gap:24px;align-items:center;padding:22px 24px}
.subcard .mark{font-size:24px}
.subcard p{color:var(--soft);margin-top:6px;max-width:60ch}

/* ---------- Dialoogvenster ---------- */
#dlg{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:rgba(5,7,15,.45)}
#dlg .box{width:min(440px,calc(100% - 40px));border-radius:28px;padding:28px 28px 24px;background:var(--glass-deep)}
#dlg h3{font:800 26px/1.1 var(--display);letter-spacing:-.02em}
#dlg p{color:var(--soft);margin:8px 0 18px}
#dlg .pinin{width:100%}
#dlg .row2{display:flex;gap:10px;margin-top:18px;justify-content:flex-end}
#dlg .err{margin-top:8px;min-height:0}

/* ================= Google TV: bediening van een afstand ================= */
body.tv{cursor:none;--blur:blur(22px) saturate(170%)}
body.tv .star{display:none}
body.tv .fav .star{display:grid;opacity:1}
body.tv #topbar,body.tv .topt.load{display:none!important}
body.tv .tvf{position:relative;z-index:2;outline:none!important;
  box-shadow:0 0 0 3px rgba(255,255,255,.95),0 0 30px rgba(255,255,255,.25),0 16px 36px -12px rgba(0,0,0,.8)!important;transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .18s}
body.tv .tile.tvf,body.tv .cat.tvf,body.tv #rail button.tvf,body.tv .ci.tvf,body.tv .topt.tvf,body.tv .row.ep.tvf{transform:scale(1.03)}
body.tv .btn.tvf,body.tv .sortbtn.tvf,body.tv .season.tvf,body.tv .back.tvf,body.tv .tsize button.tvf,body.tv .seg button.tvf,body.tv .tg.tvf{transform:scale(1.06)}
body.tv input.tvf{border-color:#fff!important}
body.tv .card.tvf{box-shadow:none!important;transform:none}
body.tv .card.tvf .poster{transform:scale(1.08);box-shadow:0 0 0 4px #fff,0 0 40px rgba(255,255,255,.3),0 30px 50px -16px rgba(0,0,0,.9)}
#hints{display:none}
body.tv #hints{display:flex;position:fixed;right:22px;top:24px;z-index:60;gap:10px;padding:8px 12px;border-radius:999px;background:var(--glass-deep);
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:var(--edge);font-size:13px;color:var(--soft)}
body.tv #hints:empty{display:none}
#hints span{display:inline-flex;align-items:center;gap:7px;padding-right:6px}
#hints kbd{font:inherit;font-weight:700;font-size:11px;min-width:24px;height:24px;padding:0 7px;border-radius:999px;display:inline-grid;place-items:center;background:rgba(255,255,255,.16);color:#fff}
body.tv #clock{display:none}
#numEntry{position:fixed;right:30px;top:24px;z-index:70;font:800 44px var(--display);padding:10px 22px;border-radius:22px;background:var(--glass-deep);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:var(--edge),var(--drop)}

@media (max-width:1100px){:root{--pad:32px}#rail button{width:72px;font-size:11px}#info{max-width:none}}

/* ================= Telefoon (iPhone en Android): bediening met de vinger ================= */
:root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}
body.phone{--pad:16px;--tabh:66px;--top:calc(var(--sat) + 58px);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
body.phone input,body.phone textarea{-webkit-user-select:text;user-select:text;font-size:16px}
body.phone #grip,body.phone .cnav,body.phone .star{display:none!important}
body.phone #shade{background:linear-gradient(0deg,rgba(8,11,24,.97) 0%,rgba(8,11,24,.8) 55%,rgba(8,11,24,.35) 100%)}
body.phone #bg .b1{width:120vw;height:120vw}
body.phone #bg .b2{width:90vw;height:90vw}
body.phone #bg .b3{width:100vw;height:100vw}

/* Kop: merk links, favorieten en instellingen rechts */
body.phone #topline{left:calc(var(--pad) + var(--sal));right:calc(var(--pad) + var(--sar));top:calc(var(--sat) + 10px);height:40px}
body.phone #topline .mark{font-size:19px}
body.phone #topline .mark i{width:20px;height:20px}
body.phone #clock{display:none}
#phBtns{display:none}
body.phone #phBtns{display:flex;gap:8px;margin-left:auto;pointer-events:auto}
#phBtns button{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--soft);background:rgba(255,255,255,.09);box-shadow:var(--edge);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
#phBtns button svg{width:20px;height:20px}
#phBtns button.on{color:#0E1022;background:var(--text)}

/* Inhoud tussen kop en tabbalk */
body.phone main,body.phone:not(.dock-open) main{padding:var(--top) calc(var(--pad) + var(--sar)) calc(var(--tabh) + var(--sab) + 18px) calc(var(--pad) + var(--sal))}
body.phone #bottom{margin-top:14px;gap:12px}
body.phone #list{padding:2px 2px 14px;margin:-2px -2px 0}

/* Live tv: het kanaal speelt in een venster bovenin */
body.phone.bgvideo:not(.full) #stage{inset:auto;top:var(--top);left:calc(var(--pad) + var(--sal));right:calc(var(--pad) + var(--sar));aspect-ratio:16/9;border-radius:20px;z-index:4;

  (matchMedia('(pointer:coarse)').matches && Math.min(screen.width, screen.height) < 600));
if(TV) document.body.classList.add('tv');
if(PHONE) document.body.classList.add('phone');
{ const m = QS.match(/[?&]notch=?(\w*)/); if(m){ const r = document.documentElement.style;

const STAR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z"/></svg>';

const BASE = CFG.storagePrefix || 'iptv.';
function gget(k, d){ try{ const v = localStorage.getItem(BASE + k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }
function gset(k, v){ try{ if(v === null) localStorage.removeItem(BASE + k); else localStorage.setItem(BASE + k, JSON.stringify(v)); }catch(e){} }
// Afspeellijsten: elke lijst bewaart favorieten, voortgang enz. onder een eigen voorvoegsel.

if(!Array.isArray(PLS)){
  const a = gget('acc', null);

let ACTIVE = gget('activePl', PLS[0]?.id || 'p1');
const plPrefix = id => id === 'p1' ? BASE : BASE + id + '.';

function b64(s){ if(!s) return ''; try{ return new TextDecoder().decode(Uint8Array.from(atob(s), c => c.charCodeAt(0))); }catch(e){ return s; } }

const S = {

  fav: load('fav', {live: [], movie: [], series: []}),
  epg: new Map(), visible: new Set(), vodInfo: new Map(), seriesOpen: null, query: '', searchType: null

/* ---------- API ---------- */
async function api(params){
  const a = S.acc;
  const q = new URLSearchParams({username: a.user, password: a.pass, ...params});
  let r;
  try{ r = await fetch(P(`${a.server}/player_api.php?${q}`)); }
  catch(e){ throw new Error('Geen verbinding. Controleer je internetverbinding en probeer het opnieuw.'); }
  if(r.status === 502) throw new Error('De IPTV-server is niet bereikbaar. Controleer de server-URL.');
  if(!r.ok) throw new Error('De IPTV-server gaf foutcode ' + r.status + '.');
  try{ return await r.json(); }
  catch(e){ throw new Error('Geen geldig antwoord van de server. Klopt de server-URL (inclusief poort)?'); }
}

/* ---------- Login ---------- */
async function login(server, user, pass){
  server = server.trim().replace(/\/+$/, '');
  if(!/^https?:\/\//i.test(server)) server = 'http://' + server;
  // Telefoons maken van de eerste letter vaak een hoofdletter ("Http://"): adres netjes maken
  server = server.replace(/^(https?):\/\/([^/]*)/i, (m, sc, host) => sc.toLowerCase() + '://' + host.toLowerCase());
  S.acc = {server, user: user.trim(), pass};
  const d = await api({});
  if(!d || !d.user_info || Number(d.user_info.auth) !== 1)
    throw new Error('Inloggen mislukt. Controleer je gebruikersnaam en wachtwoord.');
  if(d.user_info.status && d.user_info.status !== 'Active')
    throw new Error('Dit account is niet actief (status: ' + d.user_info.status + ').');
  S.info = d;
  store('acc', S.acc);
  const pl = PLS.find(x => x.id === ACTIVE);
  const nm = ($('#lName').value || '').trim();
  if(pl) Object.assign(pl, S.acc, nm ? {name: nm} : {});
  else PLS.push({id: ACTIVE, name: nm, ...S.acc});
  gset('playlists', PLS); gset('activePl', ACTIVE);
  const [cats, streams] = await Promise.all([api({action:'get_live_categories'}), api({action:'get_live_streams'})]);
  S.liveCats = Array.isArray(cats) ? cats : [];
  S.live = (Array.isArray(streams) ? streams : []).map(mapLive);
  IDB.set(SP + 'cache.live', {info: d, cats: S.liveCats, live: S.live, at: Date.now()});
}

/* Overzicht van films of series: een rij per groep (alleen telefoon) */
function showGroupRows(kind, entries, items, pick){
  clearEpgQueue(); rowObs.disconnect(); S.visible.clear(); listObs?.disconnect();
  S.type = kind; S.items = []; S.sel = -1; S.list = {ensure(){}};
  $('#info').innerHTML = '';
  const L = $('#list'); L.className = 'grows'; L.innerHTML = ''; L.scrollTop = 0;
  const H = S.home = [], add = it => (H.push(it), H.length - 1);
  const byCat = {}; items.forEach(x => (byCat[x.cat] = byCat[x.cat] || []).push(x));
  const newest = arr => arr.slice().sort((a, b) => (b.added || 0) - (a.added || 0));
  const secs = [];
  for(const e of entries){
    let list;
    if(e.id === '__res') list = continueItems(kind === 'movie' ? 'movie' : 'episode');
    else if(e.id === '__fav') list = (S.fav[kind] || []).map(f => items.find(x => x.id === f.id)).filter(Boolean);
    else if(e.id === '__new') list = newest(items.filter(x => !e.hide || !e.hide(x)));
    else if(e.mine || e.id === '__all') continue;
    else if(e.lock && !S.unlocked) continue;
    else list = newest(byCat[e.id] || []);
    if(list.length) secs.push({e, list: list.slice(0, 15)});
  }
  let n = 0;
  const sentinel = document.createElement('div'); sentinel.className = 'sentinel'; L.appendChild(sentinel);
  const more = () => {
    const end = Math.min(secs.length, n + 6); let h = '';
    for(; n < end; n++){
      const {e, list} = secs[n];
      h += `<section class="hsec"><div class="hhead"><h3>${e.mine ? GIC()[e.icon] : ''}${esc(e.name)} <small class="t">${e.count ?? ''}</small></h3><button class="hmore" data-pick="${esc(e.id)}" aria-label="Alles in ${esc(e.name)}">${GIC().chev}</button></div>
        <div class="hrow">${list.map(it => hPoster(it, add(it), e.id === '__res')).join('')}</div></section>`;
    }
    sentinel.insertAdjacentHTML('beforebegin', h);
    if(n >= secs.length){ sentinel.remove(); listObs.disconnect(); }
  };
  listObs = new IntersectionObserver(x => { if(x[0].isIntersecting) more(); }, {root: L, rootMargin: '600px'});
  more(); if(n < secs.length) listObs.observe(sentinel);
  S.rowsPick = pick;
}

// Films en series: in het geheugen en op het apparaat bewaren (IndexedDB), op de achtergrond verversen
const IDB = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open('ibstv', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const tx = (mode, fn) => open().then(db => new Promise(res => {
    const q = fn(db.transaction('kv', mode).objectStore('kv'));
    q.onsuccess = () => res(q.result); q.onerror = () => res(undefined);
  })).catch(() => undefined);
  return {get: k => tx('readonly', o => o.get(k)), set: (k, v) => tx('readwrite', o => o.put(v, k)), del: k => tx('readwrite', o => o.delete(k))};
})();
const vodKey = (kind, pre = SP) => pre + 'cache.' + kind;
const VOD_FRESH = 6 * 3600 * 1000;
async function fetchKind(kind){
  if(kind === 'movie'){
    const [c, s] = await Promise.all([api({action:'get_vod_categories'}), api({action:'get_vod_streams'})]);
    return {cats: Array.isArray(c) ? c : [], items: (Array.isArray(s) ? s : []).map(mapMovie)};
  }
  const [c, s] = await Promise.all([api({action:'get_series_categories'}), api({action:'get_series'})]);
  return {cats: Array.isArray(c) ? c : [], items: (Array.isArray(s) ? s : []).map(mapSeries)};
}
function setKind(kind, d){
  if(kind === 'movie'){ S.movieCats = d.cats; S.movies = d.items; } else { S.seriesCats = d.cats; S.series = d.items; }
}
const hasKind = kind => !!(kind === 'movie' ? S.movies : S.series);
const kindLoad = {};
function loadKind(kind){
  if(!kindLoad[kind]) kindLoad[kind] = (async () => {
    const c = S.noCache ? null : await IDB.get(vodKey(kind));
    if(c && Array.isArray(c.items) && c.items.length){
      setKind(kind, c);
      if(Date.now() - (c.at || 0) > VOD_FRESH)
        fetchKind(kind).then(d => { setKind(kind, d); IDB.set(vodKey(kind), {...d, at: Date.now()}); }).catch(() => {});
      return;
    }
    const d = await fetchKind(kind);
    setKind(kind, d); IDB.set(vodKey(kind), {...d, at: Date.now()});
  })().finally(() => { kindLoad[kind] = null; });
  return kindLoad[kind];
}
async function ensure(kind, quiet){
  if(kind !== 'movie' && kind !== 'series') return true;
  if(hasKind(kind)) return true;
  try{ await loadKind(kind); return true; }
  catch(e){ if(!quiet) listLoading(e.message); return false; }
}

function catView(kind){
  const items = kind === 'live' ? S.live : kind === 'movie' ? S.movies : S.series;
  const cats = kind === 'live' ? S.liveCats : kind === 'movie' ? S.movieCats : S.seriesCats;
  const counts = {}; items.forEach(x => counts[x.cat] = (counts[x.cat] || 0) + 1);
  const entries = cats.map(c => ({id:String(c.category_id), name:c.category_name, count:counts[String(c.category_id)] || 0, lock: groupLocked(kind, String(c.category_id))}))
    .filter(e => e.count && !SET.hidden.includes(kind + ':' + e.id));
  if(!entries.length){ listLoading(kind === 'live' ? 'Je abonnement heeft geen live zenders.' : 'Hier staat niets in je abonnement.'); return; }
  let cur = S.cat[kind];
  if(!entries.some(e => e.id === cur && (!e.lock || S.unlocked))) cur = (entries.find(e => !e.lock || S.unlocked) || entries[0]).id;
  if(kind !== 'live'){
    entries.unshift({id: '__all', name: kind === 'movie' ? 'Alle films' : 'Alle series', count: items.length});
    cur = entries.some(e => e.id === S.cat[kind] && (!e.lock || S.unlocked)) ? S.cat[kind] : '__all';
  }
  const lockedIds = new Set(entries.filter(e => e.lock).map(e => e.id));
  const visibleAll = () => items.filter(x => (S.unlocked || !lockedIds.has(x.cat)) && !SET.hidden.includes(kind + ':' + x.cat));
  if(PHONE){
    // Mijn groepen bovenaan de lade
    const mine = kind === 'live'
      ? [{id: '__recent', name: 'Laatst gekeken', icon: 'hist', count: recentLive().length},
         {id: '__fav', name: 'Favorieten', icon: 'star', count: (S.fav.live || []).length}]
      : [{id: '__res', name: 'Verder kijken', icon: 'hist', count: continueItems(kind === 'movie' ? 'movie' : 'episode').length},
         {id: '__fav', name: 'Favorieten', icon: 'star', count: (S.fav[kind] || []).length},
         {id: '__new', name: 'Nieuw toegevoegd', icon: 'bolt', count: Math.min(100, items.length)}];
    mine.forEach(m => m.mine = true);
    if(kind !== 'live') entries[0] = {id: '__all', name: 'Overzicht', icon: 'grid', count: items.length, mine: true};
    entries.splice(kind === 'live' ? 0 : 1, 0, ...mine);
    if(kind === 'live' && !['__recent', '__fav'].includes(S.cat.live) && !entries.some(e => e.id === cur)) cur = entries.find(e => !e.mine)?.id;
    if(['__recent', '__fav', '__res', '__new'].includes(S.cat[kind]) && entries.some(e => e.id === S.cat[kind])) cur = S.cat[kind];
  }
  const pick = id => {
    S.cat[kind] = id; store('cat.' + kind, id); S.seriesOpen = null;
    if(PHONE && id === '__all' && kind !== 'live'){ S.reload = () => showGroupRows(kind, entries, visibleAll(), pick); S.reload(); return; }
    const newest = a => a.slice().sort((x, y) => (y.added || 0) - (x.added || 0));
    const list = id === '__all' ? visibleAll()
      : id === '__recent' ? recentLive()
      : id === '__fav' ? (S.fav[kind] || []).map(f => items.find(x => x.id === f.id)).filter(Boolean)
      : id === '__res' ? continueItems(kind === 'movie' ? 'movie' : 'episode')
      : id === '__new' ? newest(visibleAll()).slice(0, 100)
      : items.filter(x => x.cat === id);
    if(['__recent', '__fav', '__res', '__new'].includes(id)){
      const empty = {__recent: 'Zenders die je bekijkt, verschijnen hier.', __fav: 'Nog geen favorieten. Druk lang op een zender, film of serie om hem hier te bewaren.',
        __res: 'Wat je niet afkijkt, verschijnt hier zodat je later verder kunt kijken.', __new: 'Hier staat nog niets.'}[id];
      S.reload = () => showItems(id === '__res' ? 'resume' : kind, list, empty);
      S.reload(); return;
    }
    S.reload = kind === 'live'
      ? () => showItems(kind, list, 'Deze groep is leeg.')
      : () => showItems(kind, sortItems(kind, list), 'Deze groep is leeg.', {header: sortBar(kind)});
    S.reload();

/* ---------- Horizontale groepenrij: scrollen met wiel, pijlen en slepen ---------- */
function catEdges(){
  const C = $('#cats'), B = $('#catbar');
  if(document.body.classList.contains('v-settings')){ B.classList.remove('more-l', 'more-r'); return; }
  const max = C.scrollWidth - C.clientWidth;
  B.classList.toggle('more-l', C.scrollLeft > 4);
  B.classList.toggle('more-r', C.scrollLeft < max - 4);
}
(() => {
  const C = $('#cats');
  C.addEventListener('scroll', catEdges, {passive: true});
  addEventListener('resize', catEdges);
  new ResizeObserver(catEdges).observe(C);
  new MutationObserver(() => requestAnimationFrame(catEdges)).observe(C, {childList: true, subtree: true});
  // Muiswiel omhoog/omlaag schuift de rij opzij.
  C.addEventListener('wheel', e => {
    if(document.body.classList.contains('v-settings') || C.scrollWidth <= C.clientWidth) return;
    const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    if(!d) return;
    e.preventDefault();
    C.style.scrollBehavior = 'auto';
    C.scrollLeft += d * (e.deltaMode === 1 ? 40 : 1);
    C.style.scrollBehavior = '';
  }, {passive: false});
  // Pijlknoppen: een flink stuk verder.
  document.querySelectorAll('.cnav').forEach(b => b.addEventListener('click', () => {
    C.scrollBy({left: (b.classList.contains('l') ? -1 : 1) * C.clientWidth * 0.75, behavior: 'smooth'});
  }));
  // Slepen met de muis.
  let down = null, moved = false;
  C.addEventListener('pointerdown', e => {
    if(e.button !== 0 || document.body.classList.contains('v-settings') || C.scrollWidth <= C.clientWidth) return;
    down = {x: e.clientX, left: C.scrollLeft, id: e.pointerId}; moved = false;
  });
  C.addEventListener('pointermove', e => {
    if(!down) return;
    const dx = e.clientX - down.x;
    if(!moved && Math.abs(dx) > 6){ moved = true; C.setPointerCapture(down.id); C.style.scrollBehavior = 'auto'; }
    if(moved) C.scrollLeft = down.left - dx;
  });
  const up = () => { if(down && moved){ C.style.scrollBehavior = ''; } down = null; };
  C.addEventListener('pointerup', up); C.addEventListener('pointercancel', up);
  // Na slepen geen klik op een groep.
  C.addEventListener('click', e => { if(moved){ e.stopPropagation(); e.preventDefault(); moved = false; } }, true);
})();

  const t = curT(), d = durT();
  if(!d || !isFinite(d)) return;
  if(!force && Date.now() - lastSave < 5000) return;

/* ---------- List rendering ---------- */
let listObs = null;
const rowObs = new IntersectionObserver(entries => {
  for(const e of entries){
    const id = Number(e.target.dataset.id);
    if(e.isIntersecting){ S.visible.add(id); needEpg(id); } else S.visible.delete(id);
  }
}, {root: $('#list'), rootMargin: '200px'});

function showItems(type, items, emptyText, opts = {}){
  clearEpgQueue(); rowObs.disconnect(); S.visible.clear(); listObs?.disconnect();
  S.type = type; S.items = items; S.sel = -1;
  const L = $('#list'); L.innerHTML = ''; L.scrollTop = 0;
  L.className = type === 'live' ? 'rows' : 'grid';
  if(opts.header) L.insertAdjacentHTML('afterbegin', opts.header);
  if(!items.length){ L.insertAdjacentHTML('beforeend', `<div class="empty">${esc(emptyText)}</div>`); S.list = {ensure(){}}; showIdleInfo(); return; }
  let n = 0;
  const sentinel = document.createElement('div'); sentinel.className = 'sentinel'; L.appendChild(sentinel);
  const more = () => {
    if(n >= items.length) return;
    const frag = document.createDocumentFragment();
    const end = Math.min(items.length, n + 150);
    for(; n < end; n++) frag.appendChild(type === 'live' ? rowEl(items[n], n) : cardEl(items[n], n));
    L.insertBefore(frag, sentinel);
    if(n >= items.length){ sentinel.remove(); listObs.disconnect(); }
  };
  listObs = new IntersectionObserver(e => { if(e[0].isIntersecting) more(); }, {root: L, rootMargin: '800px'});
  more(); if(n < items.length) listObs.observe(sentinel);
  S.list = {ensure(i){ while(n <= i && n < items.length) more(); }};
  const pi = S.playing && S.playing.type === type ? items.findIndex(x => x.id === S.playing.id) : -1;
  select(pi >= 0 ? pi : 0);
}

function rowEl(c, i){
  const r = document.createElement('div');
  r.className = 'row tile' + (isFav('live', c.id) ? ' fav' : '') + (isPlaying(c) ? ' playing' : '');
  r.dataset.i = i; r.dataset.id = c.id;
  r.innerHTML = `<div class="r1"><span class="logo">${c.icon ? `<img loading="lazy" src="${esc(c.icon)}" alt="">` : ''}</span>` +
    `<span class="nmw"><span class="cname">${esc(c.name)}</span><span class="num t">${c.num ? 'Kanaal ' + esc(c.num) : ''}</span></span>` +
    `<span class="eq"><i></i><i></i><i></i></span><button class="star" title="Favoriet" aria-label="Favoriet">${STAR}</button></div>` +
    `<span class="now"></span><span class="pbar off"><i></i></span><span class="next t"></span>`;
  paintRow(r, c.id);
  rowObs.observe(r);
  return r;
}

function cardEl(it, i){
  const d = document.createElement('div');
  d.className = 'card' + (isFav(it.type, it.id) ? ' fav' : '');
  d.dataset.i = i;
  const ep = it.type === 'episode';
  const title = ep ? (it.series || it.name) : it.name;
  const icon = ep ? (it.seriesIcon || it.icon) : it.icon;
  const r = isVod(it) ? RES[rkey(it)] : null, seen = isVod(it) && WATCHED[rkey(it)] && !r;
  const ph = esc((title.match(/[A-Za-z0-9]/) || ['?'])[0].toUpperCase());
  const sub = ep ? `<small>Seizoen ${esc(it.season)}, afl. ${esc(it.ep)}</small>` : '';
  const left = r && S.type === 'resume' ? `<span class="cleft">${fmtLeft(r.d - r.t)}</span>` : '';
  d.innerHTML = `<div class="poster"><span class="ph">${ph}</span>${icon ? `<img loading="lazy" src="${esc(icon)}" alt="">` : ''}` +
    `${r ? `<div class="cprog"><i style="width:${Math.min(100, r.t / r.d * 100)}%"></i></div>` : ''}${seen ? `<span class="seen">${CHECK}</span>` : ''}</div>` +
    `<span class="favdot">${STAR}</span><div class="ctitle">${esc(title)}${sub}${left}</div>`;
  return d;
}

document.addEventListener('error', e => { if(e.target.tagName === 'IMG') e.target.remove(); }, true);

function select(i, {scroll = true} = {}){
  if(i < 0 || i >= S.items.length) return;
  S.list.ensure(i);
  const L = $('#list');
  L.querySelector('.sel')?.classList.remove('sel');
  const el = L.querySelector(`[data-i="${i}"]`);
  el?.classList.add('sel');
  S.sel = i;
  if(scroll && el) el.scrollIntoView({block: 'nearest'});
  showInfo(S.items[i]);
}

function activate(i){
  const it = S.items[i]; if(!it) return;
  if(it.type === 'live'){ if(isPlaying(it)) enterFull(); else playItem(it); }
  else if(it.type === 'series') openSeries(it);
  else playItem(it);
}

$('#list').addEventListener('click', e => {
  const sb = e.target.closest('.sortbtn');
  if(sb){ setSort(sb.dataset.kind, sb.dataset.sort); return; }
  if(e.target.closest('.back')){ S.seriesOpen = null; S.reload?.(); return; }
  const season = e.target.closest('.season');
  if(season){ S.showSeason?.(season.dataset.season); return; }
  const el = e.target.closest('[data-i]'); if(!el) return;
  const i = Number(el.dataset.i), it = S.items[i];
  if(e.target.closest('.star')){ toggleFav(it); el.classList.toggle('fav', isFav(it.type, it.id)); return; }
  if(it.type === 'live'){
    if(S.sel === i && isPlaying(it)) enterFull();
    else { select(i, {scroll:false}); playItem(it); }
  }else if(it.type === 'series'){ select(i, {scroll:false}); openSeries(it); }
  else if(it.type === 'episode' && S.type !== 'resume'){ select(i, {scroll:false}); playItem(it); }
  else if(it.type === 'movie' && !TV && S.type !== 'resume'){ select(i, {scroll:false}); openMovie(it); }
  else { if(S.sel === i) playItem(it); else select(i, {scroll:false}); }
});
// Telefoon: zender, film of serie lang indrukken = favoriet
(() => {
  let tm = null, sx = 0, sy = 0, el = null;
  const L = $('#list'), cancel = () => { clearTimeout(tm); tm = null; };
  L.addEventListener('pointerdown', e => {
    if(e.pointerType !== 'touch') return;
    el = e.target.closest('[data-i]'); if(!el || el.closest('.sortbar')) return;
    sx = e.clientX; sy = e.clientY; cancel();
    tm = setTimeout(() => {
      tm = null;
      const it = S.items[Number(el.dataset.i)]; if(!it || !S.fav[it.type]) return;
      toggleFav(it); const on = isFav(it.type, it.id);
      el.classList.toggle('fav', on);
      try{ navigator.vibrate && navigator.vibrate(30); }catch(x){}
      showMsg(on ? `${it.name} staat bij je favorieten` : `${it.name} is uit je favorieten gehaald`, 1800);
      L._noClick = Date.now();
    }, 550);
  });

function clearEpgQueue(){ for(const id of epgQ){ const e = S.epg.get(id); if(e?.loading) S.epg.delete(id); } epgQ.length = 0; }
function pumpEpg(){
  while(epgActive < 4 && epgQ.length){
    const id = epgQ.shift(); epgActive++;
    api({action:'get_short_epg', stream_id:id, limit:5}).then(d => {
      const t = nowS();
      const l = (d?.epg_listings || []).map(x => ({
        t: b64(x.title), d: b64(x.description),
        s: (Number(x.start_timestamp) || Date.parse(x.start) / 1000) + (SET.epgShift || 0) * 3600,
        e: (Number(x.stop_timestamp) || Date.parse(x.end || x.stop) / 1000) + (SET.epgShift || 0) * 3600

      S.epg.set(id, {l, until: l[0] ? l[0].e : t + 900});

  if(!r.ok) throw new Error('probe ' + r.status);
  const info = await r.json();

}
const FMT_NAMES = {hevc: 'H.265 (HEVC)', h265: 'H.265 (HEVC)', av1: 'AV1', vc1: 'VC-1', mpeg2video: 'MPEG-2', mpeg4: 'MPEG-4', msmpeg4v3: 'DivX', wmv3: 'WMV',
  ac3: 'Dolby Digital-geluid', eac3: 'Dolby Digital Plus-geluid', truehd: 'Dolby TrueHD-geluid', dts: 'DTS-geluid', flac: 'FLAC-geluid', opus: 'Opus-geluid', vorbis: 'Vorbis-geluid', pcm_s16le: 'PCM-geluid'};
function vcPlan(info, ai){

  const v = vc === 'h264' && !info.video.tenbit ? 'copy' : 'x264';
  const a = !au || ['aac', 'mp3'].includes(au.codec) ? 'copy' : 'aac';
  const what = [];

  if(v === 'x264' && info.video) what.push(FMT_NAMES[vc] || vc.toUpperCase());
  if(a === 'aac' && au) what.push(FMT_NAMES[au.codec] || au.codec.toUpperCase());
  return {v, a, what: what.join(', ').replace(/, ([^,]*)$/, ' en $1')};
}

/* ---------- Keyboard ---------- */
function move(dir){
  if(!S.items.length) return;
  let step = 1;
  if(S.type === 'movie' || S.type === 'series' || S.type === 'resume' || $('#list').classList.contains('rows')){
    if(dir === 'up' || dir === 'down'){
      const cards = $('#list').querySelectorAll('.card, .tile'); let cols = 0;
      const top = cards[0]?.offsetTop;
      for(const c of cards){ if(c.offsetTop !== top) break; cols++; }
      step = Math.max(1, cols);
    }
  }else if(dir === 'left' || dir === 'right') return;
  const d = (dir === 'up' || dir === 'left') ? -step : step;
  const i = S.sel < 0 ? 0 : Math.max(0, Math.min(S.items.length - 1, S.sel + d));
  select(i);
}
document.addEventListener('keydown', e => {
  if($('#app').classList.contains('hidden') || !$('#dlg').classList.contains('hidden')) return;
  if(e.target.matches('select')) return;
  if(e.target.matches('input')){
    if(e.key === 'Escape' || e.key === 'ArrowDown'){ e.target.blur(); if(e.key === 'ArrowDown'){ e.preventDefault(); select(0); } }
    return;
  }
  const full = document.body.classList.contains('full');
  const vod = S.playing && S.playing.type !== 'live';
  if(full && !$('#resumeBox').classList.contains('hidden')){
    const btns = [...$('#resumeBox').querySelectorAll('button')];
    if(['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Tab'].includes(e.key)){
      e.preventDefault();
      const i = btns.indexOf(document.activeElement);
      btns[(i + (e.key === 'ArrowLeft' || e.key === 'ArrowUp' ? btns.length - 1 : 1)) % btns.length].focus();
    }else if(e.key === 'Escape' || e.key === 'Backspace'){ e.preventDefault(); goBack(); }
    return;
  }
  switch(e.key){
    case 'Escape': case 'Backspace':
      if(full && !$('#tracks').classList.contains('hidden')){ e.preventDefault(); openTracks(false); }
      else if(full){ e.preventDefault(); goBack(); }
      else if(S.type === 'episode'){ e.preventDefault(); S.seriesOpen = null; S.reload?.(); }
      else if(e.key === 'Escape') dockShow();
      break;
    case 'f': case 'F': toggleOsFull(); break;
    case 'm': case 'M': video.muted = !video.muted; showMsg(video.muted ? 'Geluid uit' : 'Geluid aan', 1200); break;
    case 't': case 'T': if(full) openTracks(); break;
    case 's': case 'S':
      if(!full && (S.type === 'movie' || S.type === 'series') && $('#list .sortbar')){
        const kind = S.type, i = SORTS.findIndex(x => x[0] === S.sort[kind]);
        setSort(kind, SORTS[(i + 1) % SORTS.length][0]);
        showMsg('Sorteren: ' + SORTS[(i + 1) % SORTS.length][1], 1200);
      }
      break;
    case 'Delete':
      if(!full && S.type === 'resume' && S.items[S.sel]){ forgetResume(S.items[S.sel]); S.reload?.(); }
      break;
    case 'ArrowUp': case 'ArrowDown':
      e.preventDefault();
      if(!$('#tracks').classList.contains('hidden')) break;
      if(full && !vod) zap((e.key === 'ArrowUp' ? -1 : 1) * (SET.invertZap ? -1 : 1));
      else if(!full) move(e.key === 'ArrowUp' ? 'up' : 'down');
      break;
    case 'ArrowLeft': case 'ArrowRight':
      if(full && vod){ e.preventDefault(); seekTo(curT() + (e.key === 'ArrowLeft' ? -1 : 1) * (SET.seek || 10)); osdShow(); }
      else if(!full){ e.preventDefault(); move(e.key === 'ArrowLeft' ? 'left' : 'right'); }
      break;
    case 'Enter':
      if(!full && S.sel >= 0){ e.preventDefault(); activate(S.sel); }
      else if(full) osdShow();
      break;
    case ' ':
      if(full && vod){ e.preventDefault(); vodToggle(); }
      break;
  }
});

function nearest(cur, dir, cands){

    else { if(b.top < a.bottom - 4 && by <= ay) continue; gap = Math.max(0, b.top - a.bottom); off = (b.right < a.left || b.left > a.right) ? Math.abs(ax - bx) : 0; }

      else if(dir === 'right' && grid && i % cols < cols - 1 && i + 1 < S.items.length) ni = i + 1;
      else if(dir === 'up' && i - cols >= 0) ni = i - cols;

        const vod = isVod(S.playing);
        if((vod && e.key === 'ArrowUp') || (!vod && e.key === 'ArrowRight')){
          e.preventDefault(); e.stopImmediatePropagation(); openTracks(true); setTimeout(tvSync, 60); return;
        }
        if(!vod && e.key === 'ArrowLeft'){ e.preventDefault(); e.stopImmediatePropagation(); osdShow(); return; }
        if(vod && e.key === 'ArrowDown'){ e.preventDefault(); e.stopImmediatePropagation(); osdShow(); return; }
        setTimeout(tvHints, 50);
        return;                                 // zappen en spoelen: bestaande afhandeling
      }
      e.preventDefault(); e.stopImmediatePropagation();
      tvMove(dirs[e.key]);
      return;
    }
  }, true);
  document.addEventListener('keyup', e => {
    if(e.key !== 'Enter') return;
    const ae = document.activeElement;
    if(ae && ae.matches('input:not([type=radio])')) return;
    e.preventDefault();
    if(!tvLong) tvActivate(false);
    tvLong = false;
  }, true);
  const mo = new MutationObserver(() => { clearTimeout(mo.t); mo.t = setTimeout(tvSync, 40); });
  mo.observe(document.body, {childList: true, subtree: true, attributes: true, attributeFilter: ['class']});
  // Filmbalk onderin houdt de tijd bij.
  video.addEventListener('timeupdate', () => {
    if(document.body.classList.contains('full') && isVod(S.playing) && $('#osd').classList.contains('show')) renderVodOsd(true);
  });
}
let vodOsdAt = 0;
function renderVodOsd(throttle){
  if(throttle && Date.now() - vodOsdAt < 900) return;
  vodOsdAt = Date.now();
  const it = S.playing, O = $('#osd'); if(!it) return;
  const d = isFinite(video.duration) ? video.duration : 0, t = video.currentTime || 0;
  const art = it.type === 'episode' ? (it.seriesIcon || it.icon) : it.icon;
  const head = it.type === 'episode' ? `${esc(it.series || '')} · Seizoen ${esc(it.season)}, aflevering ${esc(it.ep)}` : 'Film';
  const aud = audioList().find(x => x.on), sub = subList().find(x => x.on);
  O.innerHTML = `<div class="ologo poster">${art ? `<img src="${esc(art)}" alt="">` : ''}</div>
    <div><div class="oname">${head}${video.paused ? ' · Gepauzeerd' : ''}</div><div class="otitle">${esc(it.name)}</div>
      <div class="orow t">${fmtTime(t)}<span class="bar" style="width:min(520px,45vw)"><i style="width:${d ? Math.min(100, t / d * 100) : 0}%"></i></span>${d ? fmtTime(d) : ''}</div>
      <div class="onext">Geluid: ${esc(aud ? aud.label : 'standaard')}  ·  Ondertitels: ${esc(sub ? sub.label : 'uit')}</div></div>
    <div class="oclock t">${new Date().toLocaleTimeString('nl-NL', {hour:'2-digit', minute:'2-digit'})}</div>`;
}

/* ---------- Boot ---------- */
(async () => {
  const acc = load('acc', null);
  const showLogin = msg => {
    document.documentElement.classList.remove('boot');
    if(acc){ $('#lServer').value = acc.server; $('#lUser').value = acc.user; $('#lPass').value = acc.pass; }
    if(msg) $('#lErr').textContent = msg;
  };
  if(!acc || gget('addFrom', null)){ showLogin(); return; }
  document.documentElement.classList.add('boot');
  // Eerst wat op het apparaat bewaard is: dan staat Home er meteen. Daarna op de achtergrond verversen.
  const c = await IDB.get(SP + 'cache.live');
  if(c && Array.isArray(c.live) && c.live.length){
    S.acc = {server: acc.server, user: acc.user, pass: acc.pass};
    S.info = c.info; S.liveCats = c.cats || []; S.live = c.live;
    startApp(); document.documentElement.classList.remove('boot');
    login(acc.server, acc.user, acc.pass).catch(e => {
      // Alleen bij een geweigerde login terug naar het inlogscherm; zonder internet gewoon doorgaan.
      if(/Inloggen mislukt|niet actief/.test(e.message)){ stopVideo(); $('#app').classList.add('hidden'); $('#login').classList.remove('hidden'); showLogin(e.message); }
    });
    return;
  }
  try{ await login(acc.server, acc.user, acc.pass); startApp(); document.documentElement.classList.remove('boot'); }
  catch(e){ showLogin(e.message); }
})();
</script>
